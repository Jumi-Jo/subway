<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박스를 중앙으로 보내는 방법</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    .d1, .d2, .d3, .d4{
      width: 800px;
      height: 300px;
      background-color: yellow;
      border: 5px solid #000;
    }
    /*1.margin: 0 auto;*/
    .d1 > div{width: 100px; height: 100px;
    background-color: red; margin: 0 auto;}


    /*2. position: absolute: 사이즈를 알때*/
    .d2{position: relative;}
    .d2 > div{width: 100px; height: 100px;
      background-color: red; position: absolute;  top: 50%;
    left: 50%; margin-top: -50px; margin-left: -50px;}



    /*3.position: absolute 사이즈를 모름
    transform: translate(-50%, -50%);=자기몸의 반만큼
    2번 보다는 1,3번 씀*/
    .d3{
      position: relative;
    }
    .d3 > div{background-color: red; font-size: 50px;
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  }

    .d4 > div{
      font-size: 50px;
      background-color: rebeccapurple;
      position: absolute;
    }
    .d4{
      position: relative;
    }
/*원래 div의 width는 100%
position: absolute;를 시키면 width값 100% 사라짐
position: absolute;를 시키면 width 100%를 생략하면 안됨*/
  </style>
</head>
<body>
  <div class="d1">
    <div></div>
  </div>
  <div class="d2">
    <div></div>
  </div>
  <div class="d3">
    <div>테스트 문구입니다.fgklfjkldgk</div>
  </div>
  <div class="d4">
    <div>여기는 d4영역입니다</div>
  </div>
</body>
</html>
