<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배경속성</title>
  <style>
    .d1{
      width: 500px;
      height: 500px;
      border: 5px solid #000;
      background: url(img/history.jpg) no-repeat center / contain;
    }
    .d2{
      width: 500px;
      height: 500px;
      border: 5px solid #000;
      background: url(img/history.jpg) no-repeat center / cover;
    }
    /* 
    contain: 이미지가 잘리지 않는 대신 여백이 생ㄱ;ㅁ
    cover: 이미지가 여백 없이 들어가나 이미지의 일부가 잘ㄹㅣㅁ
    둘다 가로 세로 비율ㅇ은 그대로
    */
  </style>
</head>
<body>
  <div class="d1"></div>
  <div class="d2"></div>
</body>
</html>
